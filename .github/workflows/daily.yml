# Reads Roblox's public charts once a day, rebuilds the board and publishes it to spawnbook.com.
# Each run commits the new public/data.js (which makes Cloudflare redeploy the site) and the
# day's reading to pipeline/state/, which is the history the growth scores are worked out from.
# For the games on the board it also reads products, servers, maturity, badges and creator details.
# On Mondays it also logs that week's picks and builds the weekly report (public/report.js).
# Every run reads past picks again for the track record (public/track.js) and rebuilds the daily
# history behind the game, watchlist and market pages (public/history.js).
name: Daily data pull

on:
  schedule:
    # The board reads Roblox at 1:30 PM Pacific, during Roblox's busiest hours, so day-to-day
    # changes compare like with like. GitHub starts scheduled runs anywhere from minutes to hours
    # late (2 to 5 hours in Oct and Nov 2026), so the schedule starts about 4 hours early and an
    # early start waits for 1:30 PM (see "Wait for 1:30 PM Pacific"). GitHub also drops runs when
    # it's busy, so backups follow; each quits straight away if today's board is already out.
    # Times are UTC: 17:33 UTC is 9:33 AM Pacific in winter and 10:33 AM in summer.
    - cron: "33 17 * * *"
    - cron: "7 19 * * *"
    - cron: "41 20 * * *"
    - cron: "7 23 * * *"
  # Lets you start a run by hand from the Actions tab.
  workflow_dispatch:
  # Runs whenever this file changes, to check a new version works. It waits for 1:30 PM Pacific
  # like a scheduled run, or stops if that's more than 5 hours away. Put [skip actions] in a
  # commit message to skip it.
  push:
    branches: [main]
    paths: [".github/workflows/daily.yml"]

permissions:
  contents: write

concurrency:
  group: daily-data
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    # Up to 5 hours of waiting for 1:30 PM, then about 30 minutes of work.
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Work out today's Pacific date
        id: day
        run: |
          echo "date=$(TZ=America/Los_Angeles date +%F)" >> "$GITHUB_OUTPUT"
          echo "weekday=$(TZ=America/Los_Angeles date +%u)" >> "$GITHUB_OUTPUT"

      # Runs started by hand always go ahead. Scheduled ones skip if an earlier run already
      # published today's board.
      - name: Skip if today's board is already out
        id: done
        run: |
          last=""
          if [ -f pipeline/last-run.json ]; then
            last=$(node -e 'const d=new Date(require("./pipeline/last-run.json").at); process.stdout.write(d.toLocaleDateString("en-CA", { timeZone: "America/Los_Angeles" }))')
          fi
          echo "Last board: ${last:-none}. Today: ${{ steps.day.outputs.date }}."
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] && [ "$last" = "${{ steps.day.outputs.date }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Today's board is already out, so this run stops here."
          fi

      # Waiting is free: the repo is public, so GitHub doesn't count these minutes.
      - name: Wait for 1:30 PM Pacific
        id: wait
        if: steps.done.outputs.skip != 'true' && github.event_name != 'workflow_dispatch'
        run: |
          now=$(date +%s)
          day=$(TZ=America/Los_Angeles date -d "@$now" +%F)
          target=$(TZ=America/Los_Angeles date -d "$day 13:30" +%s)
          wait=$(( target - now ))
          if [ "$wait" -gt 18000 ]; then
            echo "It's $(TZ=America/Los_Angeles date +%H:%M) Pacific, more than 5 hours before 1:30 PM. Leaving today's board to the schedule."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ "$wait" -gt 0 ]; then
            echo "Waiting $(( wait / 60 )) minutes, until 1:30 PM Pacific."
            sleep "$wait"
          else
            echo "It's past 1:30 PM Pacific, so the reading starts now."
          fi

      - name: Read Roblox and build the board
        if: steps.done.outputs.skip != 'true' && steps.wait.outputs.skip != 'true'
        working-directory: pipeline
        run: |
          mkdir -p state/code
          node -e 'const fs=require("fs");fs.writeFileSync("state/code/collector.json",JSON.stringify({src:fs.readFileSync("collector.js","utf8")}))'
          WEEKLY=""
          if [ "${{ steps.day.outputs.weekday }}" = "1" ]; then WEEKLY="--weekly"; fi
          timeout 2700 node --no-warnings runner.mjs --state state --out out $WEEKLY
          node -e 'const s=require("./out/summary.json"); if (!s.ok) { console.error(s.error); process.exit(1); } console.log(s.board + " games on the board. Top 5: " + s.top5.join(", "))'

      - name: Save the history and publish the board
        if: steps.done.outputs.skip != 'true' && steps.wait.outputs.skip != 'true'
        run: |
          node pipeline/apply-batch.mjs pipeline/out/batch.json pipeline/state
          cp pipeline/out/data.js public/data.js
          cp pipeline/out/track.js public/track.js
          cp pipeline/out/report.js public/report.js
          cp pipeline/out/history.js public/history.js
          cp pipeline/out/summary.json pipeline/last-run.json
          if [ -f pipeline/out/picks.csv ]; then
            if [ ! -f pipeline/picks-log.csv ]; then head -n 1 pipeline/out/picks.csv > pipeline/picks-log.csv; fi
            # A second run on the same Monday replaces that day's rows instead of adding them twice.
            grep -v "^${{ steps.day.outputs.date }}," pipeline/picks-log.csv > pipeline/picks-log.tmp || true
            mv pipeline/picks-log.tmp pipeline/picks-log.csv
            tail -n +2 pipeline/out/picks.csv | sed '/^$/d' >> pipeline/picks-log.csv
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A public/data.js public/track.js public/report.js public/history.js pipeline/state pipeline/last-run.json
          if [ -f pipeline/picks-log.csv ]; then git add pipeline/picks-log.csv; fi
          git commit -m "Data for ${{ steps.day.outputs.date }}"
          git pull --rebase origin main
          git push origin HEAD:main
